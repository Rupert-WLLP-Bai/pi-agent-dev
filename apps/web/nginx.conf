server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The SPA is client-routed by react-router, which owns every path that is
    # not a real file. `docker`/`/audit-cases/...` etc. must fall back to the
    # app shell so a deep link reload does not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy the API. No trailing slash on proxy_pass, so the /api/
    # prefix is preserved (the API's routes live under /api/...).
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keep the upstream connection plain so SSE is not upgraded/held open
        # by the proxy-connection machinery.
        proxy_set_header Connection "";

        # Audit progress is streamed as Server-Sent Events; buffering would
        # hold events until the response completed, so it must stay off.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
