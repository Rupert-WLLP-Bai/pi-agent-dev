services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: contract_audit
      POSTGRES_PASSWORD: contract_audit
      POSTGRES_DB: contract_audit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contract_audit"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot: create the originals bucket, then exit. The api container treats
  # the bucket as existing, so this must finish before it is useful.
  # minio/mc is a scratch image (ENTRYPOINT ["mc"], no shell), so commands run
  # as mc arguments; MC_HOST_local defines the alias without a config file.
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    command: ["mb", "--ignore-existing", "local/contract-originals"]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://contract_audit:contract_audit@postgres:5432/contract_audit
      API_PORT: "3000"
      WEB_ORIGIN: http://localhost:8080
      AUDIT_AGENT_MODE: ${AUDIT_AGENT_MODE:-fake}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: contract-originals
      S3_REGION: us-east-1
      SUBJECT_VERIFICATION_MODE: ${SUBJECT_VERIFICATION_MODE:-fixture}
      XYG_ENDPOINT: ${XYG_ENDPOINT:-}
      XYG_API_KEY: ${XYG_API_KEY:-}
      XYG_MODEL: ${XYG_MODEL:-}
      QCC_TOKEN: ${QCC_TOKEN:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Shell form so the exit code of the fetch decides health. /api/health
      # returns 503 when Postgres or the dispatcher is down.
      test:
        - CMD-SHELL
        - >-
          bun -e "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  minio-data:
  redis-data:
