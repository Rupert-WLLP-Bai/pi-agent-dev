services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: contract_audit
      POSTGRES_PASSWORD: contract_audit
      POSTGRES_DB: contract_audit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contract_audit"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
