services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: contract_audit
      POSTGRES_PASSWORD: contract_audit
      POSTGRES_DB: contract_audit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contract_audit"]
      interval: 5s
      timeout: 3s
      retries: 5

  rustfs:
    image: rustfs/rustfs:1.0.0
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: contract_audit
      RUSTFS_SECRET_KEY: contract_audit
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot: create the originals bucket, then exit. `aws s3api create-bucket`
  # returns success when the configured account already owns the bucket, so it
  # is safe to rerun after a local stack restart.
  rustfs-init:
    image: amazon/aws-cli:latest
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: contract_audit
      AWS_SECRET_ACCESS_KEY: contract_audit
      AWS_DEFAULT_REGION: us-east-1
    command:
      ["--endpoint-url", "http://rustfs:9000", "s3api", "create-bucket", "--bucket", "contract-originals"]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://contract_audit:contract_audit@postgres:5432/contract_audit
      API_PORT: "3000"
      WEB_ORIGIN: http://localhost:8080
      AUDIT_AGENT_MODE: ${AUDIT_AGENT_MODE:-fake}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: contract_audit
      S3_SECRET_KEY: contract_audit
      S3_BUCKET: contract-originals
      S3_REGION: us-east-1
      SUBJECT_VERIFICATION_MODE: ${SUBJECT_VERIFICATION_MODE:-fixture}
      XYG_ENDPOINT: ${XYG_ENDPOINT:-}
      XYG_API_KEY: ${XYG_API_KEY:-}
      XYG_MODEL: ${XYG_MODEL:-}
      QCC_TOKEN: ${QCC_TOKEN:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Shell form so the exit code of the fetch decides health. /api/health
      # returns 503 when Postgres or the dispatcher is down.
      test:
        - CMD-SHELL
        - >-
          bun -e "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  rustfs-data:
  redis-data:
